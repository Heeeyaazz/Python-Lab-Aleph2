{# 공통 헤더 — 데스크톱은 가로 메뉴, 모바일(md 미만)은 햄버거 메뉴 #}
<header class="bg-white shadow-sm sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4">
    <div class="flex justify-between items-center h-16">

      <!-- 로고 -->
      <a href="/" class="text-xl font-bold text-indigo-600 shrink-0">✨ 모던 게시판</a>

      <!-- 데스크톱 메뉴 (md 이상에서만 보임) -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">게시판</a>
        <a href="/dashboard" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">보안 대시보드</a>
        <a href="/public-posts" class="px-3 py-2 rounded-lg text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition">부산 테마여행</a>
        <a id="nav-gold-link" href="/gold" class="hidden px-3 py-2 rounded-lg text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 transition">🥇 골드 전용</a>
        <a id="nav-admin-link" href="/admin" class="hidden px-3 py-2 rounded-lg text-sm font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 transition">🛡️ 관리자</a>
        <span id="auth-nav" class="flex items-center space-x-2 ml-2"></span>
      </nav>

      <!-- 햄버거 버튼 (md 미만에서만 보임) -->
      <button id="nav-toggle" type="button"
              class="md:hidden inline-flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
        <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- 모바일 드롭다운 메뉴 -->
    <nav id="mobile-menu" class="md:hidden hidden pb-3 space-y-1 border-t border-gray-100 pt-2">
      <a href="/" class="block px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100">게시판</a>
      <a href="/dashboard" class="block px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100">보안 대시보드</a>
      <a href="/public-posts" class="block px-3 py-2 rounded-lg text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100">부산 테마여행</a>
      <a id="nav-gold-link-mobile" href="/gold" class="hidden block px-3 py-2 rounded-lg text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100">🥇 골드 전용</a>
      <a id="nav-admin-link-mobile" href="/admin" class="hidden block px-3 py-2 rounded-lg text-sm font-medium text-rose-700 bg-rose-50 hover:bg-rose-100">🛡️ 관리자</a>
      <span id="auth-nav-mobile" class="block px-3 py-2 space-x-2"></span>
    </nav>
  </div>
</header>

<!-- 로그인 / 회원가입 모달 (모든 페이지 공용) -->
<div id="auth-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
    <h2 id="modal-title" class="text-lg font-bold mb-4">로그인</h2>
    <div class="space-y-3">
      <input type="text" id="modal-username" placeholder="아이디" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
      <input type="password" id="modal-password" placeholder="비밀번호" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
    </div>
    <p id="modal-hint" class="text-xs text-gray-400 mt-2"></p>
    <div class="mt-6 flex justify-end space-x-2">
      <button onclick="AppAuth.closeAuthModal()" class="px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100">취소</button>
      <button id="modal-submit-btn" onclick="AppAuth.submitAuth()" class="px-4 py-2 rounded-lg text-sm bg-indigo-600 text-white hover:bg-indigo-700">로그인</button>
    </div>
  </div>
</div>

<script>
  // ── 햄버거 토글 ──
  (function () {
    const btn = document.getElementById('nav-toggle');
    const menu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('icon-open');
    const iconClose = document.getElementById('icon-close');
    if (!btn || !menu) return;

    btn.addEventListener('click', function () {
      const willOpen = menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !willOpen);
      iconOpen.classList.toggle('hidden', willOpen);
      iconClose.classList.toggle('hidden', !willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
      btn.setAttribute('aria-label', willOpen ? '메뉴 닫기' : '메뉴 열기');
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth >= 768 && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        iconOpen.classList.remove('hidden');
        iconClose.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ── 공통 로그인 상태 / 등급(권한) 표시 — 모든 페이지에서 공유 ──
  // 헤더에 "로그인 유저명 + 등급"을 표기하고, 등급에 맞는 골드/관리자 메뉴를 보여준다.
  // 다른 페이지(gold.html, admin.html 등)는 이 스크립트 실행 뒤 발생하는
  // 'authchange' 이벤트를 듣고 각자 화면(정상/예외)을 그린다.
  const ROLE_NAMES = { 0: '일반 등급', 1: '골드 등급', 2: '관리자' };

  window.AppAuth = {
    _isLoginMode: true,

    getToken() { return localStorage.getItem('token'); },
    getUsername() { return localStorage.getItem('username'); },
    getRole() {
      const r = localStorage.getItem('role');
      return r === null ? null : parseInt(r, 10);
    },

    openAuthModal(isLogin) {
      this._isLoginMode = isLogin;
      document.getElementById('modal-title').innerText = isLogin ? '로그인' : '회원가입';
      document.getElementById('modal-submit-btn').innerText = isLogin ? '로그인' : '가입하기';
      document.getElementById('modal-hint').innerText = isLogin
        ? ''
        : '가입 시 "일반 등급"으로 생성됩니다. (단, 최초 가입자는 예외적으로 관리자로 생성됩니다)';
      document.getElementById('modal-username').value = '';
      document.getElementById('modal-password').value = '';
      document.getElementById('auth-modal').classList.remove('hidden');
    },
    closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    },

    async submitAuth() {
      const username = document.getElementById('modal-username').value.trim();
      const password = document.getElementById('modal-password').value;
      if (!username || !password) { alert('아이디/비밀번호를 입력해주세요.'); return; }

      const endpoint = this._isLoginMode ? '/api/auth/login' : '/api/auth/register';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) { alert(data.msg || '오류가 발생했습니다.'); return; }

      if (this._isLoginMode) {
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', data.username);
        localStorage.setItem('role', data.role);
        this.closeAuthModal();
        await this.refreshHeader();
      } else {
        alert(data.msg || '회원가입 완료! 로그인해주세요.');
        this.openAuthModal(true);
      }
    },

    logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      localStorage.removeItem('role');
      this.refreshHeader();
    },

    async refreshHeader() {
      const token = this.getToken();
      const targets = [
        { nav: document.getElementById('auth-nav'), gold: document.getElementById('nav-gold-link'), admin: document.getElementById('nav-admin-link') },
        { nav: document.getElementById('auth-nav-mobile'), gold: document.getElementById('nav-gold-link-mobile'), admin: document.getElementById('nav-admin-link-mobile') },
      ];

      const renderLoggedOut = () => {
        targets.forEach(t => {
          if (!t.nav) return;
          t.nav.innerHTML = `
            <button onclick="AppAuth.openAuthModal(true)" class="text-sm text-indigo-600 font-medium hover:underline">로그인</button>
            <button onclick="AppAuth.openAuthModal(false)" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">회원가입</button>
          `;
          if (t.gold) t.gold.classList.add('hidden');
          if (t.admin) t.admin.classList.add('hidden');
        });
        document.dispatchEvent(new CustomEvent('authchange', { detail: { loggedIn: false } }));
      };

      if (!token) { renderLoggedOut(); return; }

      try {
        const res = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('unauthorized');
        const me = await res.json();
        localStorage.setItem('username', me.username);
        localStorage.setItem('role', me.role);

        targets.forEach(t => {
          if (!t.nav) return;
          t.nav.innerHTML = `
            <span class="text-sm font-medium text-gray-700">
              <strong class="text-indigo-600">${me.username}</strong>님
              <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 ml-1">${ROLE_NAMES[me.role] || '알 수 없음'}</span>
            </span>
            <button onclick="AppAuth.logout()" class="text-sm text-red-500 hover:underline">로그아웃</button>
          `;
          if (t.gold) t.gold.classList.toggle('hidden', me.role < 1);
          if (t.admin) t.admin.classList.toggle('hidden', me.role < 2);
        });
        document.dispatchEvent(new CustomEvent('authchange', { detail: { loggedIn: true, username: me.username, role: me.role } }));
      } catch (e) {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('role');
        renderLoggedOut();
      }
    },
  };

  document.addEventListener('DOMContentLoaded', () => AppAuth.refreshHeader());
</script>
