<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  {% include 'partials/_nav.html' %}

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="admin-content">
      <div class="text-center text-gray-400 py-20">불러오는 중…</div>
    </div>
  </main>

  <script>
    const ADMIN_ROLE_NAMES = { 0: '일반 등급', 1: '골드 등급', 2: '관리자' };

    function renderException(title, message) {
      document.getElementById('admin-content').innerHTML = `
        <div class="bg-white border border-red-100 rounded-2xl shadow-sm p-10 text-center">
          <div class="text-5xl mb-4">🚫</div>
          <h2 class="text-xl font-bold text-red-600 mb-2">${title}</h2>
          <p class="text-sm text-gray-500">${message}</p>
          <a href="/" class="inline-block mt-6 text-sm text-indigo-600 hover:underline">게시판으로 돌아가기</a>
        </div>`;
    }

    async function loadAdminPage() {
      const token = AppAuth.getToken();
      if (!token) {
        renderException('로그인이 필요합니다', '관리자 전용 페이지입니다. 먼저 로그인해주세요.');
        return;
      }
      const res = await fetch('/api/admin/users', { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 403) {
        renderException('접근 권한이 없습니다', '관리자만 접근할 수 있는 페이지입니다.');
        return;
      }
      if (res.status === 401) {
        renderException('로그인이 필요합니다', '로그인 정보가 만료되었습니다. 다시 로그인해주세요.');
        return;
      }
      if (!res.ok) {
        renderException('오류가 발생했습니다', '잠시 후 다시 시도해주세요.');
        return;
      }
      const data = await res.json();
      renderUsers(data.users);
    }

    function renderUsers(users) {
      const myUsername = AppAuth.getUsername();
      document.getElementById('admin-content').innerHTML = `
        <h2 class="text-xl font-bold mb-4">🛡️ 회원 관리</h2>
        <p class="text-xs text-gray-400 mb-4">등급을 변경하거나 회원을 삭제할 수 있습니다. (자기 자신의 관리자 권한 강등/삭제는 불가)</p>
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-600">
              <tr>
                <th class="text-left px-4 py-2">ID</th>
                <th class="text-left px-4 py-2">아이디</th>
                <th class="text-left px-4 py-2">등급</th>
                <th class="text-left px-4 py-2">작업</th>
              </tr>
            </thead>
            <tbody id="user-rows" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>`;

      const tbody = document.getElementById('user-rows');
      tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2 text-gray-400">${u.id}</td>
          <td class="px-4 py-2 font-medium">${u.username}${u.username === myUsername ? ' <span class="text-xs text-indigo-500">(나)</span>' : ''}</td>
          <td class="px-4 py-2">
            <select id="role-${u.id}" class="border border-gray-300 rounded-lg px-2 py-1 text-sm">
              ${[0, 1, 2].map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${ADMIN_ROLE_NAMES[r]}</option>`).join('')}
            </select>
          </td>
          <td class="px-4 py-2 space-x-2">
            <button onclick="updateRole(${u.id})" class="text-xs text-indigo-600 hover:underline">저장</button>
            <button onclick="removeUser(${u.id})" class="text-xs text-red-500 hover:underline">삭제</button>
          </td>
        </tr>`).join('');
    }

    async function updateRole(id) {
      const role = parseInt(document.getElementById(`role-${id}`).value, 10);
      const res = await fetch(`/api/admin/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${AppAuth.getToken()}` },
        body: JSON.stringify({ role })
      });
      const data = await res.json();
      alert(data.msg);
      if (res.ok) loadAdminPage();
    }

    async function removeUser(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      const res = await fetch(`/api/admin/users/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${AppAuth.getToken()}` }
      });
      const data = await res.json();
      alert(data.msg);
      if (res.ok) loadAdminPage();
    }

    document.addEventListener('DOMContentLoaded', loadAdminPage);
    document.addEventListener('authchange', loadAdminPage);
  </script>
</body>
</html>
